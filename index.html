<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Info</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Country Information</h1>
    <div id="searchBar">
        <input type="text" id="countryInput" placeholder="Enter country name">
        <p id="warning">*At this moment, some countries are unavailable. Please make sure you write in the name correctly, and if you get an error try searching different names for that country</p>
        <button id="searchButton">Search</button>
    </div>
    <div id="countryInfo">
        <p class="text" id="introduction"></p>
        <p class="subtitle">Country Details</p>
        <p class="text" id="country_name"></p>
        <p class="text" id="official_name"></p>
        <p class="text" id="flag_description"></p>
        <p class="text" id="capital"></p>
        <p class="text" id="region"></p>
        <p class="text" id="subregion"></p>
        <p class="text" id="currency"></p>
        <p class="text" id="time_difference"></p>
        <p class="text" id="calling_code"></p>
        <p class="text" id="languages"></p>
        <p class="subtitle">Geography</p>
        <p class="text" id="location"></p>
        <p class="text" id="area"></p>
        <p class="text" id="climate"></p>
        <p class="text" id="terrain"></p>
        <p class="text" id="highest_point"></p>
        <p class="text" id="bordering_countries"></p>
        <p class="subtitle">People</p>
        <p class="text" id="population"></p>
        <p class="text" id="population_distribution"></p>
        <p class="text" id="median_age"></p>
        <p class="text" id="major_cities"></p>
        <p class="text" id="life_expectancy"></p>
        <p class="subtitle">More Information</p>
        <p class="text" id="tobacco_use"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
